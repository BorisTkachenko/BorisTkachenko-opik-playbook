quarkus.application.name=quarkus-langchain4j-pharmacy-faq
quarkus.http.port=${PHARMACY_PORT:5581}

# No Docker on the build machine and nothing here needs a backing service.
quarkus.devservices.enabled=false

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=30s

# OpenTelemetry -> Opik. Opik ingests OTLP over HTTP; http/protobuf is the encoding it accepts.
# The exporter appends /v1/traces to the endpoint itself, so give it the base URL only.
# OPIK_OTEL_HEADERS replaces the default headers (e.g. to add Authorization for Opik Cloud).
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.endpoint=${OPIK_OTEL_ENDPOINT:http://localhost:5173/api/v1/private/otel}
quarkus.otel.exporter.otlp.traces.headers=${OPIK_OTEL_HEADERS:Comet-Workspace=${OPIK_WORKSPACE:default},projectName=${OPIK_PROJECT_NAME:quarkus-langchain4j-pharmacy-faq}}
