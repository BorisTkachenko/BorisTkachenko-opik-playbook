<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crankshaft Cycles chat</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f3efe8; font-family: -apple-system, "Segoe UI", sans-serif; color: #26221c; }
    .widget { width: 100%; max-width: 400px; height: 560px; background: #fff; border-radius: 12px;
              box-shadow: 0 8px 30px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }
    header { background: #c2410c; color: #fff; padding: 14px 16px; font-weight: 600; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; }
    .bot { background: #f1ece3; align-self: flex-start; }
    .me { background: #c2410c; color: #fff; align-self: flex-end; }
    form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5dfd3; }
    input { flex: 1; padding: 9px 12px; border: 1px solid #d6cfc0; border-radius: 8px; font: inherit; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #c2410c; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="widget">
    <header>Crankshaft Cycles</header>
    <div id="log"><div class="msg bot">Hi! Ask me about repairs, prices or opening hours.</div></div>
    <form id="form"><input id="box" placeholder="Type a message" autocomplete="off" /><button>Send</button></form>
  </div>
  <script>
    // One sessionId per browser tab: the server keeps this visitor's conversation under it.
    const sessionId = "web-" + crypto.randomUUID();
    const log = document.getElementById("log"), box = document.getElementById("box");
    function add(text, cls) {
      const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
      log.appendChild(d); log.scrollTop = log.scrollHeight;
    }
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = box.value.trim(); if (!message) return;
      box.value = ""; add(message, "me");
      try {
        const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ message, sessionId }) });
        const data = await r.json(); add(r.ok ? data.reply : data.error, "bot");
      } catch { add("Network error, please try again.", "bot"); }
    });
  </script>
</body>
</html>
