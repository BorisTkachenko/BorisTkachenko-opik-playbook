[project]
name = "ollama-homebrew-rag"
version = "0.1.0"
description = "Fully local RAG over a fictional home-brewing guide: Ollama chat + embeddings, traced with Opik's LangChain integration"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8",
    "langchain-ollama>=1.2",
    "numpy>=2.0",
    "opik>=2.3.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
homebrew-rag = "homebrew_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homebrew_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
