[project]
name = "optimizer-trail-report-classifier"
version = "0.1.0"
description = "Sort park-ranger trail reports into six categories with an LLM prompt, then let an optimizer improve it"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
