[project]
name = "llamaindex-boardgame-rules-qa"
version = "0.1.0"
description = "Rules lawyer for three fictional board games: LlamaIndex RAG over rulebook PDFs, traced with Opik and checked by a rule-level test suite"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.25",
    "llama-index-embeddings-openai>=0.5.0",
    "llama-index-readers-file>=0.7.0",
    "opik>=2.3.4",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=8.0",
]

[project.scripts]
rulebook = "rulebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rulebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
