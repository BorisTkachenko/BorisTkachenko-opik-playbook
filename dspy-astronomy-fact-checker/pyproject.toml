[project]
name = "dspy-astronomy-fact-checker"
version = "0.1.0"
description = "A DSPy claim checker over a fictional astronomy fact sheet: uncompiled vs few-shot compiled, compared in Opik."
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0",
    "opik==2.3.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
