[project]
name = "whisper-vet-voicemail-triage"
version = "0.1.0"
description = "Veterinary-clinic voicemail triage: TTS -> Whisper -> urgency level and callback list"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
